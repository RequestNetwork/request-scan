[phases.setup]
# This snapshot supplies Node.js 22.23.5; the default Node 22 snapshot is older.
nixpkgsArchive = "cc368858ca7a000e1b3f014d94df9f0ea3b62391"

[phases.install]
# Require >=22.23.5 <23 while the snapshot pins the installed version.
cmds = ["node -e \"const v = process.versions.node.split('.').map(Number); if (!v.every(Number.isInteger) || v[0] !== 22 || v[1] < 23 || (v[1] === 23 && v[2] < 5)) process.exit(1)\"", "npm ci"]
