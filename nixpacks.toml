[phases.setup]
# This snapshot supplies Node.js 22.23.5; the default Node 22 snapshot is older.
nixpkgsArchive = "cc368858ca7a000e1b3f014d94df9f0ea3b62391"

[phases.install]
# Fail the build if the effective runtime differs from the security pin.
cmds = ["node -e \"if (process.version !== 'v22.23.5') process.exit(1)\"", "npm ci"]
